name: Sova CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend && npm ci --prefix frontend
      - run: npm run demo:reset
      - run: npm --prefix backend run build && npm --prefix frontend run build
      - run: npm --prefix frontend run lint && npm run test
      - run: npm run test:concurrency
      - run: npm run eval && npm run eval:holdout
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:playwright
